name: CI

on:
  push:
    branches: [main, "disaster_sim_*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # -----------------------------------------------------------------------
  # Lint — fast check that catches style/import issues before tests run
  # -----------------------------------------------------------------------
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff>=0.4

      - name: Run Ruff linter
        run: ruff check src/ tests/

      - name: Run Ruff formatter check
        run: ruff format --check src/ tests/

  # -----------------------------------------------------------------------
  # Test — full pytest suite across Python versions
  # -----------------------------------------------------------------------
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: pip install -e ".[quantum,dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

  # -----------------------------------------------------------------------
  # Simulation smoke test — verify the M2 runner produces output files
  # -----------------------------------------------------------------------
  smoke-test:
    name: Simulation Smoke Test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.12-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.12-

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run M2 simulation runner
        run: python "Disaster_simulation_and optimisation_Model/M2_src/main.py"

      - name: Verify output files exist
        run: |
          echo "Checking generated output files..."
          test -f data/outputs/scenario.json                  && echo "✅ scenario.json"
          test -f data/outputs/distance_matrix.json           && echo "✅ distance_matrix.json"
          test -f data/outputs/severity_weights.json          && echo "✅ severity_weights.json"
          test -f data/outputs/incident_hospital_matrix.json  && echo "✅ incident_hospital_matrix.json"
          test -f data/outputs/constraints.json               && echo "✅ constraints.json"
          test -f data/outputs/ambulances.csv                 && echo "✅ ambulances.csv"
          test -f data/outputs/incidents.csv                  && echo "✅ incidents.csv"
          test -f data/outputs/hospitals.csv                  && echo "✅ hospitals.csv"
          test -f data/outputs/distance_matrix.csv            && echo "✅ distance_matrix.csv"
          test -f data/outputs/severity_weights.csv           && echo "✅ severity_weights.csv"
          test -f data/outputs/incident_hospital_matrix.csv   && echo "✅ incident_hospital_matrix.csv"
          echo ""
          echo "--- scenario.json preview ---"
          head -20 data/outputs/scenario.json

      - name: Upload simulation outputs
        uses: actions/upload-artifact@v4
        with:
          name: simulation-outputs
          path: data/outputs/
          retention-days: 7
